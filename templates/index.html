<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NatGeo Study Reader · 外刊学习助手</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🌍</span>
        <h1>NatGeo Study Reader</h1>
      </div>
      <p class="brand-sub">National Geographic 外刊学习与打印助手</p>
    </header>

    <main class="app-main">
      <section class="panel input-panel">
        <h2>添加文章</h2>
        <div class="url-row">
          <input
            type="url"
            id="articleUrl"
            placeholder="粘贴 National Geographic 文章链接，例如 https://www.nationalgeographic.com/..."
          />
          <button id="fetchBtn" class="btn btn-primary">获取信息</button>
        </div>
        <div class="upload-row">
          <label class="btn btn-ghost" for="docxUpload">导入 DOCX</label>
          <input type="file" id="docxUpload" accept=".docx" hidden />
          <span class="upload-name" id="uploadName"></span>
        </div>
        <p class="hint">
          提示：本工具仅获取公开的文章标题、摘要、作者等元信息，不抓取全文。你可以将合法获取的正文粘贴到下方编辑区，或导入已有的 docx 文件继续编辑。
        </p>

        <div class="saved-articles">
          <h3>已保存的文章</h3>
          <ul id="savedList"></ul>
        </div>
      </section>

      <section class="panel editor-panel">
        <h2>编辑区</h2>
        <div class="fields">
          <label>
            <span>标题</span>
            <input type="text" id="titleField" />
          </label>
          <div class="row">
            <label>
              <span>作者</span>
              <input type="text" id="authorField" />
            </label>
            <label>
              <span>发布日期</span>
              <input type="text" id="dateField" />
            </label>
          </div>
          <label>
            <span>来源链接</span>
            <input type="text" id="urlField" />
          </label>
          <label>
            <span>摘要 / 导语</span>
            <textarea id="descField" rows="3"></textarea>
          </label>
          <label>
            <span>正文（段落之间用空行分隔，会自动编号 [1][2]…）</span>
            <textarea id="bodyField" rows="14"></textarea>
          </label>
        </div>

        <div class="actions">
          <button id="copyBtn" class="btn btn-secondary">复制到 Word</button>
          <button id="downloadBtn" class="btn btn-primary">下载 DOCX</button>
          <button id="printBtn" class="btn btn-ghost">打印 / 预览</button>
          <button id="saveLocalBtn" class="btn btn-ghost">保存到本地</button>
        </div>
      </section>

      <section class="panel preview-panel">
        <h2>打印预览</h2>
        <div id="preview" class="preview-page">
          <div class="preview-meta-top" id="previewMeta"></div>
          <h1 id="previewTitle"></h1>
          <p class="preview-subtitle" id="previewSubtitle"></p>
          <p class="preview-desc" id="previewDesc"></p>
          <div id="previewBody" class="preview-body"></div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>仅供个人学习使用，请遵守 National Geographic 的使用条款与版权规定。</p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
